<!doctype html><html><body style="margin:0;background:#000"><canvas id=c></canvas>
<script type="module">
import * as THREE from './node_modules/three/build/three.module.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w')||1600), H = +(q.get('h')||900);
const data = await (await fetch(q.get('src')||'shop.json')).json();
const r = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias: true}); r.setSize(W, H);
const lin = c => [Math.pow(c[0],2.2), Math.pow(c[1],2.2), Math.pow(c[2],2.2)];
// Lights (Unity coords) -> uniform arrays (converted to three coords by mirroring z)
const pts = data.lights.filter(l => !l.dir).slice(0, 12); const dir = data.lights.find(l => l.dir);
const d2r = Math.PI/180; const e = dir.euler;
const qd = new THREE.Quaternion().setFromEuler(new THREE.Euler(e[0]*d2r, e[1]*d2r, e[2]*d2r, 'YXZ'));
const fwd = new THREE.Vector3(0,0,1).applyQuaternion(qd); // unity light forward
const toLight = new THREE.Vector3(-fwd.x, -fwd.y, fwd.z); // to three coords (mirror z) and invert
const uniforms = {
  uPL: { value: pts.map(l => new THREE.Vector3(l.pos[0], l.pos[1], -l.pos[2])) },
  uPC: { value: pts.map(l => new THREE.Vector3(...lin(l.color)).multiplyScalar(l.intensity)) },
  uPR: { value: pts.map(l => l.range) },
  uDir: { value: toLight.normalize() }, uDirC: { value: new THREE.Vector3(...lin(dir.color)).multiplyScalar(dir.intensity) },
  uSky: { value: new THREE.Vector3(...lin([0.36,0.28,0.30])) }, uEq: { value: new THREE.Vector3(...lin([0.24,0.18,0.17])) }, uGround: { value: new THREE.Vector3(...lin([0.10,0.075,0.07])) },
  uFog: { value: new THREE.Vector3(...lin([0.13,0.09,0.13])) }, uMap: { value: null }, uHasMap: { value: 0 }, uRim: { value: 0 }
};
const N = pts.length;
const vs = `attribute vec4 vcol; varying vec4 vC; varying vec3 vN; varying vec3 vW; varying vec2 vUv; varying vec3 vV;
 void main(){ vC=vcol; vUv=uv; vN=normalize(mat3(modelMatrix)*normal); vec4 wp=modelMatrix*vec4(position,1.0); vW=wp.xyz; vV=normalize(cameraPosition-wp.xyz); gl_Position=projectionMatrix*viewMatrix*wp; }`;
const fs = `#define N ${N}
 uniform vec3 uPL[N]; uniform vec3 uPC[N]; uniform float uPR[N]; uniform vec3 uDir, uDirC, uSky, uEq, uGround, uFog; uniform sampler2D uMap; uniform float uHasMap, uRim;
 varying vec4 vC; varying vec3 vN; varying vec3 vW; varying vec2 vUv; varying vec3 vV;
 vec3 shade(vec3 n, vec3 l){ float ndl=dot(n,l)*0.5+0.5; float ramp=smoothstep(0.39,0.57,ndl); return mix(vec3(0.42,0.33,0.40), vec3(1.0), ramp); }
 void main(){ vec3 n=normalize(vN); if(!gl_FrontFacing) n=-n;
  vec3 tex = uHasMap>0.5 ? pow(texture2D(uMap, vUv).rgb, vec3(2.2)) : vec3(1.0);
  vec3 albedo = tex * pow(vC.rgb, vec3(2.2)); float glow = clamp(1.0-vC.a,0.0,1.0);
  vec3 amb = n.y>0.0 ? mix(uEq,uSky,n.y) : mix(uEq,uGround,-n.y);
  vec3 light = amb + uDirC*shade(n,uDir);
  for(int i=0;i<N;i++){ vec3 d=uPL[i]-vW; float dist=length(d); float x=dist/uPR[i]; float att = x<1.0 ? (1.0/(1.0+25.0*x*x))*smoothstep(1.0,0.75,x) : 0.0; light += uPC[i]*att*shade(n,d/dist); }
  vec3 c = albedo*(1.0-glow*0.5)*light + albedo*glow*1.4;
  if(uRim>0.0){ float rim=pow(1.0-clamp(dot(vV,n),0.0,1.0),3.0); c+=vec3(1.0,0.82,0.6)*0.18*rim; }
  float dcam = length(cameraPosition - vW); float f = clamp((dcam-7.0)/(26.0-7.0),0.0,1.0); c = mix(c, uFog, f*0.85*(1.0-glow*0.6));
  gl_FragColor=vec4(pow(c,vec3(1.0/2.2)),1.0); }`;
const textures = {};
for (const [id, b64] of Object.entries(data.textures)) { const bin = atob(b64); const arr = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  const t = new THREE.DataTexture(arr, 256, 256, THREE.RGBAFormat); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.magFilter=THREE.LinearFilter; t.minFilter=THREE.LinearMipmapLinearFilter; t.generateMipmaps=true; t.needsUpdate=true; textures[id]=t; }
const texFor = { Wood:'wood', Planks:'planks', Brick:'brick', Plaster:'plaster', Cobble:'cobble', Cloth:'cloth' };
const mats = {};
function mat(name){ if(mats[name]) return mats[name];
  if(name==='Glass'){ mats[name]=new THREE.ShaderMaterial({transparent:true, depthWrite:false, vertexShader: vs, fragmentShader:`attribute vec4 dummy; varying vec4 vC; varying vec3 vN; varying vec3 vV; varying vec3 vW; varying vec2 vUv; void main(){ vec3 n=normalize(vN); float rim=pow(1.0-clamp(dot(n,vV),0.0,1.0),2.5)*0.55; vec3 h=normalize(normalize(vec3(-0.35,1.0,-0.25))+vV); float spec=smoothstep(0.92,0.97,clamp(dot(n,h),0.0,1.0))*0.55; vec4 c=vec4(0.75,0.88,0.92,0.18)*vec4(pow(vC.rgb,vec3(2.2)),vC.a); c.rgb+=vec3(1.0,0.95,0.85)*rim+spec; c.a=clamp(c.a+rim*0.6+spec,0.0,1.0); gl_FragColor=vec4(pow(c.rgb,vec3(1.0/2.2)),c.a);} `.replace('attribute vec4 dummy;','')}); return mats[name]; }
  const u = THREE.UniformsUtils.clone(uniforms); u.uPL.value=uniforms.uPL.value; u.uPC.value=uniforms.uPC.value; u.uPR.value=uniforms.uPR.value;
  if (texFor[name]) { u.uMap.value = textures[texFor[name]]; u.uHasMap.value = 1; }
  if (name==='Character') u.uRim.value = 1;
  mats[name] = new THREE.ShaderMaterial({ uniforms: u, vertexShader: vs, fragmentShader: fs, side: THREE.FrontSide }); return mats[name]; }
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x221c3e);
const root = new THREE.Group(); root.scale.z = -1; scene.add(root);
for (const p of data.pieces) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p.p, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(p.n, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(p.uv, 2)); g.setAttribute('vcol', new THREE.Uint8BufferAttribute(p.c, 4, true)); g.setIndex(p.i);
  const m = new THREE.Mesh(g, mat(p.mat)); m.position.set(...p.off); m.rotation.set(p.rot[0]*d2r, p.rot[1]*d2r, p.rot[2]*d2r, 'YXZ');
  if (p.mat==='Glass') m.renderOrder = 1; root.add(m);
}
// Player camera: eye 1.62, facing +Z (unity) => -Z (three); yaw/pitch in unity degrees (pitch + = down)
const yaw = +(q.get('yaw')||0), pitch = +(q.get('pitch')||15), fov = +(q.get('fov')||55);
const cam = new THREE.PerspectiveCamera(fov, W/H, 0.05, 80);
const ex = +(q.get('x')||0), ey = +(q.get('y')||1.62), ez = +(q.get('z')||0);
cam.position.set(ex, ey, -ez);
const dirU = new THREE.Vector3(Math.sin(yaw*d2r)*Math.cos(pitch*d2r), -Math.sin(pitch*d2r), Math.cos(yaw*d2r)*Math.cos(pitch*d2r));
cam.lookAt(ex + dirU.x, ey + dirU.y, -ez - dirU.z);
r.render(scene, cam); document.title = 'done';
</script></body></html>
